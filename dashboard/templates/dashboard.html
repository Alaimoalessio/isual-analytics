<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISUAL Analytics Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo">
                <h1>ISUAL</h1>
                <span class="subtitle">Analytics Dashboard</span>
            </div>
            <div class="header-right">
                <div id="db-status" class="db-status connecting">
                    <span class="status-text">🟡 Connessione DB...</span>
                </div>
                <button id="theme-toggle" class="btn btn-icon" title="Toggle Dark Mode">
                    🌙
                </button>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <!-- Error/Success Alerts -->
        <div id="alert-container"></div>

        <!-- Barra Controlli -->
        <section class="controls-bar">
            <div class="controls-left">
                <div class="control-group">
                    <label for="brand-select">Brand</label>
                    <select id="brand-select" class="form-select">
                        <option value="all">Tutti i brand</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Periodo</label>
                    <div class="period-toggle" id="period-toggle">
                        <button class="btn btn-outline period-btn active" data-days="30">30gg</button>
                        <button class="btn btn-outline period-btn" data-days="60">60gg</button>
                        <button class="btn btn-outline period-btn" data-days="90">90gg</button>
                    </div>
                </div>
            </div>
            <div class="controls-right">
                <span class="last-update" id="last-update-text">Aggiornato il --/--/---- alle --:--</span>
                <button id="refresh-btn" class="btn btn-icon btn-refresh" title="Ricarica dati">🔄</button>
            </div>
        </section>

        <!-- Sezione 1: KPI Live -->
        <section class="section kpi-section">
            <div class="section-header">
                <h2>KPI Live</h2>
                <span class="kpi-date-range" id="kpi-date-range">Caricamento...</span>
            </div>
            <div class="kpi-grid" id="kpi-grid">
                <!-- Verrà popolato da app.js -->
            </div>
        </section>

        <!-- Sezione 2: Performance Trend -->
        <section class="section trend-section">
            <div class="section-header">
                <h2>Performance Trend — Giornaliero</h2>
                <div class="metric-switcher" id="metric-switcher">
                    <button class="btn btn-outline metric-btn active" data-metric="reach">Reach</button>
                    <button class="btn btn-outline metric-btn" data-metric="impressions">Impressions</button>
                    <button class="btn btn-outline metric-btn" data-metric="engagement">Engagement</button>
                </div>
            </div>
            <div class="chart-container" id="trend-chart-container">
                <canvas id="trend-canvas"></canvas>
            </div>
        </section>

        <!-- Sezione 3: Top Partner -->
        <section class="section partners-section">
            <div class="section-header">
                <h2>Top Partner</h2>
            </div>
            <div class="partners-grid" id="partners-grid">
                <!-- Verrà popolato da app.js -->
            </div>
        </section>

        <!-- Sezione 4: Storico Report -->
        <section class="section history-section">
            <div class="section-header">
                <h2>Storico Report</h2>
                <div class="history-actions">
                    <button id="export-csv-btn" class="btn btn-outline">
                        <span class="btn-text">Scarica CSV</span>
                        <span class="spinner hidden"></span>
                    </button>
                    <button id="generate-btn" class="btn btn-primary">
                        <span class="btn-text">Genera Report PDF</span>
                        <span class="spinner hidden"></span>
                    </button>
                </div>
            </div>
            <div class="table-container">
                <table class="reports-table">
                    <thead>
                        <tr>
                            <th>Nome File</th>
                            <th>Data Generazione</th>
                            <th>Dimensione</th>
                            <th>Azione</th>
                        </tr>
                    </thead>
                    <tbody id="reports-body">
                        <tr>
                            <td colspan="4" class="text-center loading-text">Caricamento storico...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
